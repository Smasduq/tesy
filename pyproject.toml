[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tesy"
version = "0.2.0"
description = "Your co-worker and friend. A small, provider-agnostic chat companion with a local voice."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Captain Smasduq", email = "sadiqulmasduq2010@gmail.com" },
]
keywords = ["chat", "voice", "openrouter", "ollama", "snowflake", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/Smasduq/tesy"
Repository = "https://github.com/Smasduq/tesy"
Issues = "https://github.com/Smasduq/tesy/issues"
Changelog = "https://github.com/Smasduq/tesy/blob/main/CHANGELOG.md"

[project.scripts]
tesy = "tesy.cli:main"

[tool.setuptools.packages.find]
include = ["tesy*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools]
include-package-data = false
